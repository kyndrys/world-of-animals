<!DOCTYPE html>
<html>
<head>
  <title>Calculator</title>
  <script>    
    function add() {
      let a = document.getElementById("num1").value;
      let b = document.getElementById("num2").value;
      let c = Number(a)+Number(b);
      document.getElementById("ans").innerHTML=c;
    }
   
    function subtract() {
      let a = document.getElementById("num1").value;
      let b = document.getElementById("num2").value;
      let c = Number(a)-Number(b);
      document.getElementById("ans").innerHTML=c;
    }

    function multiply() {
      let a = document.getElementById("num1").value;
      let b = document.getElementById("num2").value;
      let c = Number(a)*Number(b);
      document.getElementById("ans").innerHTML=c;
    }

    function divide() {
      let a = document.getElementById("num1").value;
      let b = document.getElementById("num2").value;
      let c = Number(a)/Number(b);
      document.getElementById("ans").innerHTML=c;
    }

    function pythagorean() {
      let a = document.getElementById("num1").value;
      let a2 = Number(a)*Number(a);
      let b = document.getElementById("num2").value;
      let b2 = Number(b)*Number(b);
      let c = Math.sqrt(a2+b2);
      document.getElementById("ans").innerHTML=c;
    }

  </script>
</head>

<body>
  <h1>Addition Calculator</h1>
  <p>First Number: <input Id="num1">
    Second Number: <input Id="num2">  </p>
  <p><button onclick="add()">Add</button>
    <button onclick="subtract()">Minus</button>
    </button><button onclick="multiply()">Multiply</button>
    </button><button onclick="divide()">Divide</button>
    </button><button onclick="pythagorean()">Pythagorean's Theorem</button>  </p>
  <br>
  <p>Answer: <span Id="ans"> </span></p>
</body>
</html>
